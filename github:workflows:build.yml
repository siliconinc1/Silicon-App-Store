name: Build IPA + APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: 18 }
      - uses: actions/setup-java@v3
        with: { distribution: 'temurin', java-version: '17' }
      - run: npm install
      - run: npx cap add android
      - run: npx cap copy
      - run: |
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: SiliconStore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: 18 }
      - run: npm install
      - run: npx cap add ios
      - run: npx cap copy
      - run: |
          cd ios/App
          pod install
      - run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r SiliconStore.ipa Payload
      - uses: actions/upload-artifact@v3
        with:
          name: SiliconStore-IPA
          path: SiliconStore.ipa